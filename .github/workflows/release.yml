name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate new CalVer version
        id: version
        run: |
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            CURRENT="${{ steps.prev_tag.outputs.tag }}"
            CURRENT="${CURRENT#v}"
          else
            CURRENT="0.0.0"
          fi

          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          PREFIX="${YEAR}.${MONTH}"

          if [[ "$CURRENT" == "${PREFIX}."* ]]; then
            MICRO=$(echo "$CURRENT" | cut -d. -f3)
            MICRO=$((MICRO + 1))
          else
            MICRO=1
          fi

          NEW_VERSION="${PREFIX}.${MICRO}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Bump version in package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Get merged PR title
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              commit_sha: context.sha,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (prs.data.length > 0) {
              return { title: prs.data[0].title, number: prs.data[0].number };
            }
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            return { title: commit.data.commit.message.split('\n')[0], number: null };

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          PR_TITLE=$(echo '${{ steps.pr.outputs.result }}' | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.title)")
          PR_NUM=$(echo '${{ steps.pr.outputs.result }}' | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.number || '')")

          if [ -n "$PR_NUM" ]; then
            ENTRY="- ${PR_TITLE} (#${PR_NUM})"
          else
            ENTRY="- ${PR_TITLE}"
          fi

          NEW_SECTION="## [${VERSION}] - ${DATE}\n\n${ENTRY}"

          if [ -f CHANGELOG.md ]; then
            HEADER=$(head -4 CHANGELOG.md)
            TAIL=$(tail -n +5 CHANGELOG.md)
            printf '%s\n\n%b\n\n%s\n' "$HEADER" "$NEW_SECTION" "$TAIL" > CHANGELOG.md
          else
            printf '# Changelog\n\nAll notable changes to this project are documented in this file.\n\n%b\n' "$NEW_SECTION" > CHANGELOG.md
          fi

      - name: Commit and push version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${VERSION}"
          git tag "v${VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
